<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="sonar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>sonar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
  :root {
    --black: #07090e;
    --kodama: #3e466b;
    --water: #2E4A8C;
    --water-hi: #9FC8F0;
    --ink: #d8e4f2;
    --dim: #8c99b5;
    --row: 28px;   /* height of a slider row's track; 44 on touch and small screens */
    --hit: 36px;   /* minimum height of a button or menu; 44 on touch and small screens */
    --text: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font: var(--text)/1.3 "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  #app { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: row;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; }
  #c { display: block; touch-action: none; }

  /* the rail: strip, tabs, panels that scroll inside themselves, transport pinned at the bottom */
  #hud { flex: 0 0 340px; width: 340px; min-height: 0; display: flex; flex-direction: column; background: var(--black);
    border-left: 1px solid var(--kodama); z-index: 10; }
  #hud.hidden { display: none !important; }
  #strip { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 8px 12px; border-bottom: 1px solid var(--kodama); }
  #strip .word { font-weight: 500; letter-spacing: 0.04em; }
  .fact { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fact b { color: var(--ink); font-weight: 500; }
  #strip .spacer { display: none; }
  #f-nosig { display: none; color: var(--water-hi); white-space: normal; }
  #f-nosig.show { display: inline; }
  #tabs { flex: 0 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--kodama); }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 1 0 auto; border: 0; border-right: 1px solid var(--kodama); padding: 0 10px; min-width: 44px; }
  #tabs button.open { background: var(--water); color: var(--ink); }
  #panels { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .panel { display: none; padding: 6px 12px 10px; border-bottom: 1px solid var(--kodama); }
  .panel.open { display: block; }
  .ghead { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; padding-bottom: 2px; color: var(--water-hi); font-weight: 500; border-bottom: 1px solid var(--kodama); }
  .ghead span { flex: 1; }
  .ghead button { min-width: var(--hit); padding: 0 6px; }
  .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; padding: 3px 0; color: var(--dim); }
  .ctl b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / 3; }
  .ctl select { min-width: 0; max-width: 220px; text-overflow: ellipsis; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
  .note { color: var(--dim); padding: 4px 0; white-space: normal; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; padding: 4px 0; }
  .thumbs button.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; height: auto; min-height: 0; padding: 3px 0; color: var(--dim); }
  .thumbs button.tile.on { color: var(--ink); border-color: var(--water-hi); background: transparent; }
  .thumbs canvas { width: 56px; height: 56px; display: block; }
  .editor { border-top: 1px solid var(--kodama); margin-top: 6px; padding-top: 4px; }
  .editor input[type=text] { width: 100%; box-sizing: border-box; }
  #ed-preview { width: 120px; height: 120px; display: block; margin: 4px 0; border: 1px solid var(--kodama); }
  .mrow { display: grid; grid-template-columns: 1fr auto auto; column-gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--kodama); }
  .mrow span { color: var(--dim); }
  .mrow b { grid-column: 1; grid-row: 2; font-weight: 400; font-size: 0.85em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mrow button { grid-row: 1 / 3; padding: 0 8px; }
  .mrow.conflict span { color: var(--water-hi); font-weight: 500; }
  .mrow.conflict b::before { content: "! "; font-weight: 500; }
  #midi-conflicts { color: var(--water-hi); font-weight: 500; }
  #transport { flex: 0 0 auto; padding: 8px 12px; border-top: 1px solid var(--kodama); display: grid; gap: 6px; }
  #transport .row { display: flex; gap: 6px; align-items: stretch; }
  #transport .row button { flex: 1 1 0; min-width: 0; padding: 0 2px; }
  #b-play { width: 100%; }
  #meter { position: relative; flex: 0 0 44px; min-height: var(--hit); border: 1px solid var(--kodama); overflow: hidden; }
  #meter i { position: absolute; left: 0; right: 0; bottom: 0; top: 0; background: var(--water-hi); transform-origin: bottom; transform: scaleY(0); }

  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--kodama); border-radius: 0;
    padding: 2px 12px; cursor: pointer; min-height: var(--hit); touch-action: manipulation; }
  button:hover, button:focus-visible { border-color: var(--water-hi); outline: none; }
  button.on { background: var(--water); border-color: var(--water); }
  button:disabled { color: var(--dim); opacity: 0.5; cursor: default; }
  select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--black); border: 1px solid var(--kodama);
    border-radius: 0; padding: 2px 6px; min-height: var(--hit); }
  input[type=text], textarea { -webkit-user-select: text; user-select: text; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: var(--row); margin: 0; background: transparent; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--kodama); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--kodama); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -10px; background: var(--water-hi); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; background: var(--water-hi); border: 0; border-radius: 0; }
  a { color: var(--water-hi); }
  #keys { display: none; margin: 4px 0 0; }
  #keys.show { display: block; }
  #keys table { border-collapse: collapse; }
  #keys td { padding: 2px 12px 2px 0; vertical-align: top; }
  #keys td:first-child { color: var(--water-hi); white-space: nowrap; }
  #panic { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top)); z-index: 12; color: var(--dim); display: none; }
  #panic.show { display: block; }
  /* blackout is a plain overlay above everything; it works whatever the canvas or MIDI does */
  #blackout { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; cursor: none; }
  #blackout.on { display: block !important; }

  /* touch screens, and anything small: taller rows, 16 px text (so iOS does not zoom a focused field) */
  @media (pointer: coarse), (max-width: 820px), (max-height: 560px) {
    :root { --row: 44px; --hit: 44px; --text: 16px; }
    .ctl { padding: 0; }
  }
  /* phone portrait, small tablets: stage pinned on top at 55 percent or more, the rail below */
  @media (max-width: 820px) and (orientation: portrait) {
    #app { flex-direction: column; }
    #stage { flex: 1 1 55%; min-height: 55%; }
    #hud { flex: 0 1 auto; width: auto; max-height: 45%; border-left: 0; border-top: 1px solid var(--kodama); }
  }
  /* compact: the strip keeps what matters while playing */
  @media (max-width: 820px), (max-height: 560px) {
    #strip { padding: 3px 12px; }
    #strip .word, #f-src, #f-note, #f-bpm, #f-seed, #f-loops { display: none; }
  }
  /* short landscape: the side rail stays, narrower, and scrolls */
  @media (max-height: 560px) and (orientation: landscape) {
    #hud { flex: 0 0 min(320px, 44vw); width: min(320px, 44vw); }
    #transport { padding: 4px 8px; gap: 4px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="1280" height="640" aria-label="sonar"></canvas></div>
  <aside id="hud">
    <div id="strip">
      <span class="word">sonar</span>
      <span class="fact" id="f-src">sim</span>
      <span class="fact" id="f-p1">1 <b>p13</b> g1/2</span>
      <span class="fact" id="f-p2">2 <b>p13</b> g1/2</span>
      <span class="fact" id="f-note">note <b>-</b></span>
      <span class="fact" id="f-bpm"><b>90</b> bpm</span>
      <span class="fact" id="f-seed">seed <b>-</b></span>
      <span class="fact" id="f-loops">loops <b>0</b>/4 · 4 bar</span>
      <span class="fact" id="f-out"></span>
      <span class="fact" id="f-nosig">no signal at the output: check the device mute switch, volume and output device</span>
      <span class="spacer"></span>
    </div>
    <nav id="tabs"></nav>
    <div id="panels"></div>
    <div id="transport">
      <button id="b-play" class="on" title="Space">play</button>
      <div class="row">
        <button id="b-reseed" title="R">reseed</button>
        <button id="b-layer" title="L">+ loop</button>
        <button id="b-clear" title="C">clear</button>
        <button id="b-enable" title="enable audio and MIDI">enable</button>
        <span id="meter" title="output level"><i></i></span>
      </div>
    </div>
  </aside>
</div>
<div id="panic">panic · Esc hold 1 s to resume</div>
<div id="blackout"></div>
<script>
  // Blackout lives here, outside the app module: it works even if app.js,
  // the canvas, audio or MIDI fails. Others register mute hooks on it.
  (function () {
    var el = document.getElementById("blackout");
    var hooks = [];
    window.sonarBlackout = {
      on: false,
      set: function (v) {
        this.on = !!v;
        el.classList.toggle("on", this.on);
        for (var i = 0; i < hooks.length; i++) { try { hooks[i](this.on); } catch (e) {} }
      },
      toggle: function () { this.set(!this.on); },
      hook: function (f) { hooks.push(f); }
    };
    window.addEventListener("keydown", function (e) {
      if ((e.key === "b" || e.key === "B") && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target && e.target.tagName) && e.target.type !== "range") return;
        if (!e.repeat) window.sonarBlackout.toggle();
        e.preventDefault();
      }
    }, true);
  })();
</script>
